name: Build & Release

on:
  push:
    tags:
      - 'v*'   # v1.0.0, v1.2.3 gibi tag'ler tetikler

permissions:
  contents: write  # Release oluşturmak için gerekli

jobs:
  build-and-release:
    name: Build DesktopOrganizer & Publish Release
    runs-on: macos-14   # Apple Silicon (arm64) runner

    steps:
      # 1. Repo'yu klonla
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Xcode seç (Xcode 15+)
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # 3. Versiyon numarasını tag'den çıkar (v1.2.3 → 1.2.3)
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # 4. Info.plist içindeki sürümü güncelle
      - name: Update Info.plist version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLIST="DesktopOrganizer/Resources/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION"            "$PLIST"

      # 5. Derle
      - name: Build with build.sh
        run: bash build.sh

      # 6. .app'ı ZIP'le
      - name: Create ZIP
        run: |
          cd build
          zip -r --symlinks DesktopOrganizer.zip DesktopOrganizer.app

      # 7. GitHub Release oluştur ve ZIP'i yükle
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Desktop Organizer ${{ steps.version.outputs.version }}"
          body: |
            ## 🖥️ Desktop Organizer ${{ steps.version.outputs.version }}

            ### Kurulum
            1. `DesktopOrganizer.zip` dosyasını indirin
            2. Zip'i açın → `DesktopOrganizer.app`'ı Uygulamalar klasörüne sürükleyin
            3. Uygulamayı çalıştırın

            > **⚠️ Gatekeeper Uyarısı:** Sistem Ayarları → Gizlilik ve Güvenlik → "Yine de Aç" butonuna tıklayın.

            ### Otomatik Güncelleme
            Uygulama arka planda bu sayfayı kontrol eder. Yeni sürüm çıktığında ana pencerede yeşil 🚀 butonu belirir.
          files: build/DesktopOrganizer.zip
          draft: false
          prerelease: false
